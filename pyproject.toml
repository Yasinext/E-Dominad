[project]
name = "domainbot"
version = "0.1.0"
description = "Telegram group bot for deterministic .com RDAP scans and weekly monitoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.10,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "greenlet>=3.0,<4",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "types-openpyxl>=3.1,<4",
]

[project.scripts]
domainbot-bot = "domainbot.main_bot:main"
domainbot-worker = "domainbot.main_worker:main"
domainbot-scheduler = "domainbot.main_scheduler:main"
domainbot-btk-worker = "domainbot.main_btk_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domainbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
